name: Build Windows EXE

on:
  workflow_dispatch: # 允许在 GitHub 网页上手动点击触发
  push:
    tags:
      - 'v*' # 推送 v1.0.0 这种 tag 时触发并发布 Release

jobs:
  build:
    runs-on: windows-latest # 必须在 Windows 环境下构建

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 选择一个稳定的 Python 版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-docx openpyxl python-pptx Pillow reportlab odfpy EbookLib fonttools pycdlib py7zr pywin32

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --name FileForgeWin --hidden-import win32com.client --hidden-import pythoncom --hidden-import win32timezone --collect-all py7zr --collect-all pycdlib --collect-all fontTools --collect-all odf --collect-all reportlab gen_all.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileForgeWin-EXE
          path: dist/FileForgeWin.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FileForgeWin.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
